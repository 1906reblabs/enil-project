name: "ENIL — Daily Data Monitor"

# ─────────────────────────────────────────────────────────────────────────────
# SINGLE-REPO VERSION
# Runs the data pipeline daily, commits results back to the same repo,
# then triggers a site rebuild via the site_rebuild.yml workflow.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # 04:00 UTC = 06:00 SAST daily
    - cron: "0 4 * * *"

  workflow_dispatch:
    inputs:
      source:
        description: "Source to run (all | dbe | nsfas | aps | labour)"
        required: false
        default: "all"
      dry_run:
        description: "Dry run? (true = validate only, no writes)"
        required: false
        default: "false"

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ── Job 1: Extract → Validate → Commit ──────────────────────────────────────
  extract:
    name: "Extract → Validate → Commit"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system deps (OCR + OpenCV)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng libgl1-mesa-glx

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright
        run: playwright install chromium --with-deps

      - name: Run pipeline
        id: pipeline
        env:
          GITHUB_ACTIONS: "true"
          PIPELINE_SOURCE: ${{ github.event.inputs.source || 'all' }}
        run: |
          DRY_FLAG=""
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && DRY_FLAG="--dry-run"
          python pipeline/pipeline.py --source "$PIPELINE_SOURCE" $DRY_FLAG

      - name: Check for data changes
        id: diff
        run: |
          git diff --quiet pipeline/data/ || echo "CHANGED=true" >> "$GITHUB_OUTPUT"

      - name: Commit data updates
        if: steps.diff.outputs.CHANGED == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "ENIL Pipeline Bot"
          git config user.email "pipeline@enil.co.za"
          git add pipeline/data/ pipeline/runs/ || true
          git commit -m "🤖 Data update $(date +%Y-%m-%d) — run ${{ github.run_id }}"
          git push

      - name: Upload pipeline log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-log-${{ github.run_id }}
          path: enil_pipeline.log
          retention-days: 30

  # ── Job 2: Trigger site rebuild ─────────────────────────────────────────────
  rebuild-site:
    name: "Trigger Site Rebuild"
    needs: extract
    if: success()
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Dispatch site_rebuild.yml
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner:       context.repo.owner,
              repo:        context.repo.repo,
              workflow_id: 'site_rebuild.yml',
              ref:         'main',
              inputs: {
                triggered_by: 'data-pipeline'
              }
            });
            console.log('✅ Site rebuild dispatched');

  # ── Job 3: NSFAS portal health check ────────────────────────────────────────
  portal-check:
    name: "NSFAS Portal Health Check"
    needs: extract
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check myNSFAS portal
        id: nsfas
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://mynsfas.nsfas.org.za --max-time 15 || echo "000")
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "NSFAS portal HTTP status: $STATUS"
          [ "$STATUS" = "200" ] && echo "✅ Portal up" || echo "⚠️ Portal may be down"

      - name: Log portal-down alert
        if: steps.nsfas.outputs.status != '200'
        run: |
          echo "⚠️ NSFAS portal returned status ${{ steps.nsfas.outputs.status }}"
          echo "ACTION NEEDED: Update nsfas/index.html crisis banner and send WhatsApp alert"
          # Webhook integration (add ALERT_WEBHOOK secret to enable):
          # curl -X POST "${{ secrets.ALERT_WEBHOOK }}" \
          #   -H "Content-Type: application/json" \
          #   -d '{"text":"⚠️ NSFAS portal DOWN — status ${{ steps.nsfas.outputs.status }}"}'
          
