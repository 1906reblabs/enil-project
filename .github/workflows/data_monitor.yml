name: "ENIL — Daily Data Monitor"

on:
  schedule:
    # 04:00 UTC = 06:00 SAST
    - cron: "0 4 * * *"

  workflow_dispatch:
    inputs:
      source:
        description: "Source to run (all | dbe | nsfas | aps | labour)"
        required: false
        default: "all"

      dry_run:
        description: "Validate only (true/false)"
        required: false
        default: "false"

env:
  PYTHON_VERSION: "3.11"

jobs:

  extract:
    name: Extract → Validate → Commit
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    permissions:
      contents: write

    outputs:
      changed: ${{ steps.diff.outputs.changed }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright
        run: |
          playwright install chromium --with-deps

      - name: Run pipeline
        env:
          PIPELINE_SOURCE: ${{ github.event.inputs.source || 'all' }}
        run: |
          DRY_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi

          python pipeline/pipeline.py \
            --source "$PIPELINE_SOURCE" \
            $DRY_FLAG

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet pipeline/data/ pipeline/runs/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updates
        if: steps.diff.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "ENIL Pipeline Bot"
          git config user.email "pipeline@enil.co.za"

          git add pipeline/data pipeline/runs

          git commit -m "🤖 Daily ENIL update (${{
            github.run_number
          }})"

          git push origin HEAD

      - name: Wait for GitHub to index commit
        if: steps.diff.outputs.changed == 'true'
        run: sleep 10

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-log-${{ github.run_id }}
          path: enil_pipeline.log
          retention-days: 30


  rebuild-site:
    name: Trigger Site Rebuild

    needs: extract

    if: needs.extract.outputs.changed == 'true'

    runs-on: ubuntu-24.04

    permissions:
      actions: write
      contents: read

    steps:

      - name: Trigger site rebuild
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "site_rebuild.yml",
              ref: context.ref.replace("refs/heads/", ""),
              inputs: {
                triggered_by: "data-pipeline"
              }
            });

            console.log("✅ Site rebuild dispatched successfully.");


  portal-check:
    name: NSFAS Portal Health Check

    needs: extract

    if: always()

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:

      - name: Check NSFAS portal
        id: nsfas

        run: |
          STATUS=$(curl \
            -s \
            -o /dev/null \
            -w "%{http_code}" \
            --max-time 15 \
            https://mynsfas.nsfas.org.za || echo "000")

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

          echo "Portal HTTP status: $STATUS"

      - name: Portal available
        if: steps.nsfas.outputs.status == '200'
        run: echo "✅ NSFAS portal is online."

      - name: Portal unavailable
        if: steps.nsfas.outputs.status != '200'
        run: |
          echo "⚠️ NSFAS portal returned ${{ steps.nsfas.outputs.status }}"
          echo "Consider updating the site banner."

          # Optional webhook
          # curl -X POST "${{ secrets.ALERT_WEBHOOK }}" \
          #   -H "Content-Type: application/json" \
          #   -d '{"text":"NSFAS portal appears to be offline."}'
