name: "ENIL — Daily Data Monitor"

on:
  # 04:00 UTC = 06:00 SAST daily
  schedule:
    - cron: "0 4 * * *"

  # Manual trigger with options
  workflow_dispatch:
    inputs:
      source:
        description: "Source to run (all | dbe | nsfas | aps | labour)"
        required: false
        default: "all"
      dry_run:
        description: "Dry run? (true = validate only)"
        required: false
        default: "false"

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ── Job 1: Extract, validate, commit ──────────────────────────────────────
  extract:
    name: "Extract → Validate → Commit"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout enil-data
        uses: actions/checkout@v4
        with:
          repository: ENIL-ZA/enil-data
          token: ${{ secrets.ENIL_DATA_TOKEN }}
          path: enil-data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system deps (OCR + OpenCV)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-afr \
                                  libgl1-mesa-glx

      - name: Install Python dependencies
        run: pip install -r enil-data/requirements.txt

      - name: Install Playwright
        run: playwright install chromium --with-deps

      - name: Run pipeline
        id: pipeline
        working-directory: enil-data
        env:
          GITHUB_ACTIONS: "true"
          PIPELINE_SOURCE: ${{ github.event.inputs.source || 'all' }}
        run: |
          DRY_FLAG=""
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && DRY_FLAG="--dry-run"
          python pipeline/pipeline.py --source "$PIPELINE_SOURCE" $DRY_FLAG

      - name: Check for data changes
        id: diff
        working-directory: enil-data
        run: |
          git diff --quiet pipeline/data/ || echo "CHANGED=true" >> "$GITHUB_OUTPUT"

      - name: Commit data updates
        if: steps.diff.outputs.CHANGED == 'true' && github.event.inputs.dry_run != 'true'
        working-directory: enil-data
        run: |
          git config user.name  "ENIL Pipeline Bot"
          git config user.email "pipeline@enil.co.za"
          git add pipeline/data/ pipeline/runs/
          git commit -m "🤖 Data update $(date +%Y-%m-%d) — pipeline run ${{ github.run_id }}"
          git push

      - name: Upload pipeline log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-log-${{ github.run_id }}
          path: enil-data/enil_pipeline.log
          retention-days: 30

  # ── Job 2: Trigger site rebuild ───────────────────────────────────────────
  rebuild-site:
    name: "Trigger Site Rebuild"
    needs: extract
    if: success()
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch rebuild to enil-site
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ENIL_SITE_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'ENIL-ZA',
              repo:  'enil-site',
              workflow_id: 'site_rebuild.yml',
              ref:   'main',
              inputs: { triggered_by: 'data-pipeline', date: new Date().toISOString().split('T')[0] }
            });
            console.log('Site rebuild dispatched');

  # ── Job 3: NSFAS portal alert ─────────────────────────────────────────────
  portal-check:
    name: "NSFAS Portal Health Check"
    needs: extract
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check myNSFAS portal
        id: nsfas
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://mynsfas.nsfas.org.za --max-time 15 || echo "000")
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "NSFAS portal HTTP status: $STATUS"

      - name: Alert if portal down
        if: steps.nsfas.outputs.status != '200'
        run: |
          echo "⚠️ NSFAS portal returned status ${{ steps.nsfas.outputs.status }}"
          echo "Trigger WhatsApp/email alert via configured webhook"
          # curl -X POST "${{ secrets.ALERT_WEBHOOK }}" \
          #   -H "Content-Type: application/json" \
          #   -d '{"text":"⚠️ NSFAS portal is DOWN — status ${{ steps.nsfas.outputs.status }}"}'

  # ── Job 4: Ping Google Search Console ────────────────────────────────────
  seo-ping:
    name: "Ping Google Search Console"
    needs: rebuild-site
    if: success() && github.event_name == 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Ping sitemap
        run: |
          curl -s "https://www.google.com/ping?sitemap=https://enil.co.za/sitemap.xml" || true
          echo "Sitemap pinged"
