name: "ENIL — Weekly Orchestration"

# ─────────────────────────────────────────────────────────────────────────────
# SINGLE-REPO VERSION
# Runs every Monday 06:00 SAST. Produces the weekly intelligence report,
# content queue, revenue pipeline review, and moat assessment.
# Report is committed to obsidian/04-Weekly-Logs/ and weekly_reports/.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # Every Monday 04:00 UTC = 06:00 SAST
    - cron: "0 4 * * 1"

  workflow_dispatch:
    inputs:
      phase:
        description: "Single phase only (1–5, blank = all)"
        required: false
        default: ""
      skip_pipeline:
        description: "Skip pipeline refresh? (true/false)"
        required: false
        default: "false"
      dry_run:
        description: "Dry run — no file writes? (true/false)"
        required: false
        default: "false"

env:
  PYTHON_VERSION: "3.11"

jobs:
  orchestrate:
    name: "Weekly Intelligence + Revenue + Optimisation Loop"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Install Playwright
        run: playwright install chromium --with-deps

      - name: Run weekly orchestrator
        id: orchestrate
        env:
          GITHUB_ACTIONS: "true"
        run: |
          PHASE_ARG=""
          [ -n "${{ github.event.inputs.phase }}" ] && PHASE_ARG="--phase ${{ github.event.inputs.phase }}"

          SKIP_ARG=""
          [ "${{ github.event.inputs.skip_pipeline }}" = "true" ] && SKIP_ARG="--skip-pipeline"

          DRY_ARG=""
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && DRY_ARG="--dry-run"

          python weekly_orchestrator.py $PHASE_ARG $SKIP_ARG $DRY_ARG

      - name: Check for report changes
        id: diff
        run: |
          git diff --quiet weekly_reports/ obsidian/ revenue_pipeline.json 2>/dev/null \
            || echo "CHANGED=true" >> "$GITHUB_OUTPUT"

      - name: Commit weekly report
        if: steps.diff.outputs.CHANGED == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "ENIL Orchestration Bot"
          git config user.email "orchestration@enil.co.za"
          git add weekly_reports/ obsidian/ revenue_pipeline.json logs/ 2>/dev/null || true
          git commit -m "📊 Weekly report $(date +%Y-%m-%d) — run ${{ github.run_id }}"
          git push

      - name: Upload orchestration log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-orchestration-log-${{ github.run_id }}
          path: logs/weekly_orchestrator.log
          retention-days: 90

      - name: Write step summary
        if: always()
        run: |
          REPORT=$(ls weekly_reports/*.json 2>/dev/null | sort | tail -1)
          echo "## ENIL Weekly Orchestration" >> $GITHUB_STEP_SUMMARY
          if [ -n "$REPORT" ]; then
            echo "**Week:** $(python3 -c "import json; d=json.load(open('$REPORT')); print(d.get('week',''))")" >> $GITHUB_STEP_SUMMARY
            echo "**Opportunities:** $(python3 -c "import json; d=json.load(open('$REPORT')); print(len(d.get('intelligence',{}).get('opportunities',[])))")" >> $GITHUB_STEP_SUMMARY
            echo "**Next run:** $(python3 -c "import json; d=json.load(open('$REPORT')); print(d.get('next_run',''))")" >> $GITHUB_STEP_SUMMARY
          else
            echo "_Report file not found — check logs_" >> $GITHUB_STEP_SUMMARY
          fi
          
